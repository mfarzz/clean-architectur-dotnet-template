services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mycleanapi-sqlserver
    environment:
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql/data

volumes:
  sqlserver_data:
