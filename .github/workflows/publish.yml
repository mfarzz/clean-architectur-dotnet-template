name: Publish NuGet Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MyCleanApi.slnx

      - name: Run Tests
        run: dotnet test MyCleanApi.slnx --no-restore --verbosity normal

      - name: Pack Template
        run: dotnet pack packaging/Mfarzz.CleanArchitecture.Template.csproj -c Release -o ./dist

      - name: NuGet login (OIDC Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: 'mfarzz'

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./dist/*.nupkg \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
